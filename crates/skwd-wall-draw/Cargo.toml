[package]
name = "skwd-wall-draw"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Transient Skwd-deck drawing preparation helper"

[dependencies]
skwd-config = { path = "../skwd-config" }
skwd-palette = { path = "../skwd-palette" }
skwd-wall-core = { path = "../skwd-wall-core" }
wall-proto = { path = "../wall-proto" }
paper-control = { path = "../../../skwd-paper/crates/paper-control" }
anyhow = "1"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
libc = "0.2"
libloading = "0.9"
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "api-27",
    "cuda",
    "load-dynamic",
    "std",
] }
rayon = "1"
serde.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "skwd-wall-draw"
path = "src/main.rs"

[lints]
workspace = true
