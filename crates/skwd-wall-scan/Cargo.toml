[package]
name = "skwd-wall-scan"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Transient Skwd Deck media scanner and thumbnail helper"

[dependencies]
wall-proto = { path = "../wall-proto" }
paper-scene = { path = "../../../skwd-paper/crates/paper-scene" }
paper-runtime = { path = "../../../skwd-paper/crates/paper-runtime" }
skwd-wall-core = { path = "../skwd-wall-core", features = ["media"] }
skwd-palette = { path = "../skwd-palette" }
anyhow = "1"
bcdec_rs = "0.2"
block_compression = { version = "=0.7.0", default-features = false, features = ["bc7", "wgpu"] }
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "0.4"
tempfile = { workspace = true }
serde.workspace = true
serde_json = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
rayon = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "io-std", "process", "sync", "time"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
dhat = { workspace = true, optional = true }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", default-features = false, features = ["macros"] }

[features]
obs-heap = ["skwd-wall-core/obs-heap"]
obs-dhat = ["dep:dhat"]

[package.metadata.cargo-machete]
ignored = ["dhat"]

[lints]
workspace = true
