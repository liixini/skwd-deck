[package]
name = "skwd-wall-effects"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Transient Skwd Deck image-effects helper"

[dependencies]
skwd-palette = { path = "../skwd-palette" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
serde_json = "1"
anyhow = "1"
webp = "0.3"
rayon = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "process", "io-util"] }

[[bin]]
name = "skwd-wall-effects"
path = "src/main.rs"

[lints]
workspace = true
